<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام MUQ</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>نظام MUQ</h1>
            <h2>تسجيل الدخول</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="userType">نوع المستخدم</label>
                    <select id="userType" name="userType" required>
                        <option value="admin">أدمن</option>
                        <option value="teacher">مدرس</option>
                        <option value="student">طالب</option>
                        <option value="administrative">موظف إداري</option>
                        <option value="security">موظف أمني</option>
                        <option value="service">موظف خدمة</option>
                        <option value="gate">مشغّل بوابة الدخول</option>
                        <option value="registration">مشغّل بوابة التسجيل</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
            </form>
            <p id="errorMessage" class="error-message"></p>
            <div class="login-portal-links">
                <span>أو ادخل مباشرة إلى:</span>
                <a href="login.html?next=gate">بوابة الدخول</a>
                <a href="login.html?next=registration">بوابة التسجيل</a>
            </div>
        </div>
    </div>
    <script src="/static/Js/api-client.js"></script>
    <script src="/static/Js/login.js"></script>
</body>
</html>
