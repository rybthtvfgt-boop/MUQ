<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة الأقسام الجديدة</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--primary-orange);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px;
        }

        .btn-primary {
            background: var(--brand-gradient);
            color: #fff;
        }

        .log-box {
            background: var(--dark-bg);
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: var(--success);
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }

        .status.success {
            background: var(--success);
            color: #000;
        }

        .status.error {
            background: var(--error);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>إضافة الأقسام الجديدة</h1>

        <div class="status" id="status">
            جاهز لإضافة الأقسام
        </div>

        <div style="text-align: center;">
            <button class="btn btn-primary" onclick="addDepartments()">إضافة الأقسام</button>
        </div>

        <div class="log-box" id="logBox">
            <div>انتظر لبدء الإضافة...</div>
        </div>
    </div>

    <script>
        function log(message) {
            const logBox = document.getElementById('logBox');
            const timestamp = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function addDepartments() {
            log('🔄 بدء إضافة الأقسام الجديدة...');

            try {
                // قراءة الأقسام الحالية
                let departments = JSON.parse(localStorage.getItem('muq_departments')) || [];
                log(`📦 عدد الأقسام الحالية: ${departments.length}`);

                // الأقسام الجديدة
                const newDepartments = [
                    {
                        id: Date.now() + 1,
                        name: 'استعلامات 2',
                        description: 'قسم الاستعلامات',
                        stages: []
                    },
                    {
                        id: Date.now() + 2,
                        name: 'أمن ومراقبة 3',
                        description: 'قسم الأمن والمراقبة',
                        stages: []
                    },
                    {
                        id: Date.now() + 3,
                        name: 'حراسة',
                        description: 'قسم الحراسة',
                        stages: []
                    }
                ];

                // إضافة الأقسام الجديدة
                departments = [...departments, ...newDepartments];
                localStorage.setItem('muq_departments', JSON.stringify(departments));

                log(`✅ تم إضافة ${newDepartments.length} قسم جديد`);
                log(`📊 إجمالي عدد الأقسام: ${departments.length}`);

                newDepartments.forEach(dept => {
                    log(`  - ${dept.name}`);
                });

                setStatus('✅ تم إضافة الأقسام بنجاح!', 'success');
                log('✅ يمكنك الآن استخدام هذه الأقسام في النظام');

            } catch (error) {
                setStatus('❌ فشل في الإضافة', 'error');
                log('❌ خطأ: ' + error.message);
            }
        }
    </script>
</body>
</html>
