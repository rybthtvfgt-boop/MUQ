<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول والخروج - نظام MUQ</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--page-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .kiosk-container {
            width: 100%;
            max-width: 1600px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .camera-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid var(--primary-orange);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid var(--border-strong);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .log-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid var(--border-strong);
            display: flex;
            flex-direction: column;
            max-height: 700px;
        }

        h1 {
            color: var(--primary-orange);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        h2 {
            color: var(--primary-orange);
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            border: 3px solid var(--border-strong);
        }

        #canvas {
            display: none;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
        }

        .mode-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--border-strong);
            border-radius: 10px;
            background: var(--elevated-bg);
            color: var(--text-secondary);
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            border-color: var(--primary-orange);
            background: var(--primary-orange);
            color: #000;
        }

        .mode-btn:hover {
            border-color: var(--primary-orange);
        }

        .status-display {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .status-waiting {
            background: var(--elevated-bg);
            color: #fff;
            border: 2px solid #555;
        }

        .status-granted {
            background: linear-gradient(135deg, var(--success), #00cc00);
            color: #000;
            border: 2px solid var(--success);
            animation: pulse-green 1s infinite;
        }

        .status-denied {
            background: linear-gradient(135deg, var(--error), #cc0000);
            color: #fff;
            border: 2px solid var(--error);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes pulse-red {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .person-info {
            margin-top: 20px;
            padding: 20px;
            background: var(--dark-bg);
            border-radius: 15px;
            border: 1px solid var(--border-strong);
        }

        .person-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-strong);
        }

        .person-info-item:last-child {
            border-bottom: none;
        }

        .person-info-label {
            color: var(--text-secondary);
            font-weight: bold;
        }

        .person-info-value {
            color: var(--primary-orange);
            font-weight: bold;
        }

        .instruction {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 20px;
            font-size: 1.2em;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: var(--primary-orange);
            animation: scan 2s linear infinite;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        @media (max-width: 768px) {
            .kiosk-container {
                grid-template-columns: 1fr;
            }
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .log-table th {
            background: var(--elevated-bg);
            color: var(--primary-orange);
            padding: 10px;
            text-align: right;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        .log-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-strong);
            color: var(--text-secondary);
        }

        .log-table tr:hover {
            background: var(--dark-bg);
        }

        .log-table tr.entry {
            border-left: 3px solid var(--success);
        }

        .log-table tr.exit {
            border-left: 3px solid #ff9800;
        }

        .log-table tr.denied {
            border-left: 3px solid var(--error);
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }

        .log-header {
            color: var(--primary-orange);
            font-size: 1.3em;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-strong);
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-badge.entry {
            background: var(--success);
            color: #000;
        }

        .status-badge.exit {
            background: #ff9800;
            color: #000;
        }

        .status-badge.denied {
            background: var(--error);
            color: #fff;
        }

        .mode-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 10;
        }

        .mode-indicator.entry-mode {
            background: var(--success);
            color: #000;
        }

        .mode-indicator.exit-mode {
            background: #ff9800;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="kiosk-container">
        <div class="camera-section">
            <h1>بوابة الدخول والخروج</h1>
            <div class="mode-selector">
                <button class="mode-btn active" id="entryModeBtn" onclick="setMode('entry')">دخول</button>
                <button class="mode-btn" id="exitModeBtn" onclick="setMode('exit')">خروج</button>
            </div>
            <div class="camera-wrapper">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <div class="scan-line" id="scanLine"></div>
                <div class="mode-indicator entry-mode" id="modeIndicator">وضع الدخول</div>
            </div>
            <p class="instruction" id="instructionText">انظر إلى الكاميرا لتسجيل الدخول</p>
        </div>

        <div class="info-section">
            <h2>حالة العملية</h2>
            <div class="status-display status-waiting" id="statusDisplay">
                في انتظار التعرف...
            </div>

            <div class="person-info" id="personInfo" style="display: none;">
                <div class="person-info-item">
                    <span class="person-info-label">الاسم:</span>
                    <span class="person-info-value" id="personName">-</span>
                </div>
                <div class="person-info-item">
                    <span class="person-info-label">النوع:</span>
                    <span class="person-info-value" id="personType">-</span>
                </div>
                <div class="person-info-item">
                    <span class="person-info-label">القسم:</span>
                    <span class="person-info-value" id="personDepartment">-</span>
                </div>
                <div class="person-info-item">
                    <span class="person-info-label">نوع العملية:</span>
                    <span class="person-info-value" id="operationType">-</span>
                </div>
                <div class="person-info-item">
                    <span class="person-info-label">الوقت:</span>
                    <span class="person-info-value" id="entryTime">-</span>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startRecognition()" style="margin-top: 20px; width: 100%;">
                بدء التعرف
            </button>
            <button class="btn btn-secondary" onclick="stopRecognition()" style="margin-top: 10px; width: 100%;">
                إيقاف التعرف
            </button>
        </div>

        <div class="log-section">
            <h2>سجل الحركة</h2>
            <div class="log-container">
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>الوقت</th>
                            <th>الاسم</th>
                            <th>النوع</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                    </tbody>
                </table>
            </div>
            <button class="btn btn-secondary" onclick="clearLog()" style="margin-top: 10px; width: 100%;">
                مسح السجل
            </button>
        </div>
    </div>

    <script src="/static/Js/face-config.js"></script>
    <script src="../vendor/face-api/face-api.min.js"></script>
    <script src="/static/Js/face-recognition-engine.js"></script>
    <script src="/static/Js/face-storage.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDisplay = document.getElementById('statusDisplay');
        const personInfo = document.getElementById('personInfo');
        const scanLine = document.getElementById('scanLine');
        const modeIndicator = document.getElementById('modeIndicator');
        const instructionText = document.getElementById('instructionText');

        let isRecognizing = false;
        let inFlight = false;
        let lastOperationId = null;
        let recognitionInterval = null;
        let cameraStream = null;
        let entryLog = [];
        let currentMode = 'entry'; // 'entry' or 'exit'

        function setStatus(text, kind) {
            statusDisplay.textContent = text;
            statusDisplay.className = `status-display status-${kind}`;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('entryModeBtn').classList.toggle('active', mode === 'entry');
            document.getElementById('exitModeBtn').classList.toggle('active', mode === 'exit');
            
            if (mode === 'entry') {
                modeIndicator.textContent = 'وضع الدخول';
                modeIndicator.className = 'mode-indicator entry-mode';
                instructionText.textContent = 'انظر إلى الكاميرا لتسجيل الدخول';
            } else {
                modeIndicator.textContent = 'وضع الخروج';
                modeIndicator.className = 'mode-indicator exit-mode';
                instructionText.textContent = 'انظر إلى الكاميرا لتسجيل الخروج';
            }
        }

        async function init() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('الكاميرا غير متاحة — استخدم HTTPS أو localhost', 'denied');
                return;
            }
            try {
                const ok = await faceEngine.loadModels();
                if (!ok) {
                    setStatus('تعذّر تحميل نماذج التعرّف', 'denied');
                    return;
                }
                console.log('✅ تم تحميل النماذج');

                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: FACE_CONFIG.FRAME.WIDTH },
                        height: { ideal: FACE_CONFIG.FRAME.HEIGHT }
                    }
                });
                video.srcObject = cameraStream;
                setStatus('الكاميرا جاهزة — ابدأ التعرف', 'waiting');
            } catch (error) {
                console.error('❌ خطأ في التهيئة:', error);
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    setStatus('تم رفض إذن الكاميرا — فعّله من إعدادات المتصفح', 'denied');
                } else {
                    setStatus('خطأ في تشغيل الكاميرا', 'denied');
                }
            }
        }

        function startRecognition() {
            if (isRecognizing) {
                stopRecognition();
                return;
            }
            if (!faceEngine.modelsLoaded) {
                setStatus('النماذج لم تُحمّل بعد', 'denied');
                return;
            }
            isRecognizing = true;
            lastOperationId = null;
            scanLine.style.display = 'block';
            setStatus('جارٍ الفحص...', 'waiting');
            recognitionInterval = setInterval(recognizeFace, 2000);
        }

        function stopRecognition() {
            isRecognizing = false;
            scanLine.style.display = 'none';
            if (recognitionInterval) {
                clearInterval(recognitionInterval);
                recognitionInterval = null;
            }
            setStatus('في انتظار التعرف...', 'waiting');
        }

        async function recognizeFace() {
            if (inFlight || !isRecognizing) return;
            inFlight = true;
            try {
                canvas.width = video.videoWidth || FACE_CONFIG.FRAME.WIDTH;
                canvas.height = video.videoHeight || FACE_CONFIG.FRAME.HEIGHT;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                const detection = await faceEngine.detectFace(canvas);
                if (!detection) {
                    if (isRecognizing) setStatus('لم يتم اكتشاف وجه — انظر إلى الكاميرا مباشرة', 'waiting');
                    return;
                }
                const faceSize = detection.detection.box.width;
                if (faceSize < FACE_CONFIG.QUALITY.MIN_FACE_SIZE) {
                    setStatus('اقترب من الكاميرا — الوجه صغير', 'waiting');
                    return;
                }
                if (faceSize > FACE_CONFIG.QUALITY.MAX_FACE_SIZE) {
                    setStatus('ابتعد قليلاً — قريب جداً من الكاميرا', 'waiting');
                    return;
                }

                const embedding = Array.from(detection.descriptor);
                const result = await processGateOperation(embedding, currentMode);

                if (result.operation_id && result.operation_id === lastOperationId) return;

                if (result.matched && result.saved) {
                    lastOperationId = result.operation_id;
                    const operationLabel = currentMode === 'entry' ? 'دخول' : 'خروج';
                    setStatus(`✅ تم التعرف وتسجيل ${operationLabel}`, 'granted');

                    personInfo.style.display = 'block';
                    document.getElementById('personName').textContent = result.person.name;
                    document.getElementById('personType').textContent = getPersonTypeLabel(result.person.user_type);
                    document.getElementById('personDepartment').textContent = result.person.code || '-';
                    document.getElementById('operationType').textContent = operationLabel;
                    document.getElementById('entryTime').textContent = new Date().toLocaleTimeString('ar-EG');

                    addToLog(result.person.name, currentMode, true);
                    stopRecognition();
                    setTimeout(() => {
                        if (!isRecognizing) {
                            setStatus('في انتظار التعرف...', 'waiting');
                            startRecognition();
                        }
                    }, 5000);
                } else if (result.denied) {
                    setStatus('غير مخوّل — سجّل الدخول من حساب البوابة', 'denied');
                    stopRecognition();
                } else if (result.networkError) {
                    setStatus('تعذّر التحقق — انقطاع الاتصال بالخادم', 'denied');
                } else {
                    setStatus('وجه غير معروف — لا يوجد سجل', 'denied');
                    addToLog('غير معروف', currentMode, false);
                    setTimeout(() => {
                        if (isRecognizing) setStatus('جارٍ الفحص...', 'waiting');
                    }, 3000);
                }
            } catch (error) {
                console.error('خطأ في التعرف:', error);
                setStatus('تعذّر التحقق — خطأ تقني', 'denied');
            } finally {
                inFlight = false;
            }
        }

        async function processGateOperation(embedding, mode) {
            try {
                const response = await fetch(`${FACE_CONFIG.STORAGE.API_URL}/api/attendance/gate-operation`, {
                    method: 'POST',
                    headers: faceStorage.authHeaders(),
                    body: JSON.stringify({
                        embedding: embedding,
                        operation: mode,
                        location: 'البوابة الرئيسية'
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (response.status === 401 || response.status === 403) {
                    return { matched: false, denied: true };
                }
                if (!response.ok && result.matched === undefined) {
                    return { matched: false, saved: false, reason: result.reason || result.error || 'رفض الخادم' };
                }
                return result;
            } catch (error) {
                return { matched: false, networkError: true };
            }
        }

        function getPersonTypeLabel(type) {
            const labels = {
                'student': 'طالب',
                'teacher': 'مدرس',
                'administrative': 'موظف إداري',
                'security': 'موظف أمني',
                'service': 'موظف خدمة',
                'gate': 'بوابة',
                'registration': 'قسم التسجيل'
            };
            return labels[type] || type;
        }

        function addToLog(name, operation, granted) {
            const entry = {
                time: new Date().toLocaleTimeString('ar-EG'),
                name: name,
                operation: operation,
                granted: granted
            };

            entryLog.unshift(entry);

            if (entryLog.length > 50) {
                entryLog = entryLog.slice(0, 50);
            }

            updateLogTable();
        }

        function updateLogTable() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            entryLog.forEach(entry => {
                const row = document.createElement('tr');
                row.className = entry.granted ? entry.operation : 'denied';

                const statusBadge = document.createElement('span');
                statusBadge.className = `status-badge ${entry.granted ? entry.operation : 'denied'}`;
                statusBadge.textContent = entry.operation === 'entry' ? 'دخول' : 'خروج';

                row.innerHTML = `
                    <td>${entry.time}</td>
                    <td>${entry.name}</td>
                    <td></td>
                `;

                row.lastChild.appendChild(statusBadge);
                tbody.appendChild(row);
            });
        }

        function clearLog() {
            entryLog = [];
            updateLogTable();
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        window.addEventListener('pagehide', function () { stopRecognition(); stopCamera(); });

        init();
    </script>
</body>
</html>
