<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الوجه الذكي - نظام MUQ</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .face-registration-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 900;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        #videoElement {
            width: 100%;
            border-radius: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .face-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border: 3px solid rgba(102, 126, 234, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        .face-frame.valid {
            border-color: #38ef7d;
            box-shadow: 0 0 30px rgba(56, 239, 125, 0.5);
        }

        .face-frame.invalid {
            border-color: #f45c43;
            box-shadow: 0 0 30px rgba(244, 92, 67, 0.5);
        }

        .face-frame.too-close {
            border-color: #f45c43;
            border-width: 5px;
            animation: pulse-red 0.5s infinite;
        }

        .face-frame.too-far {
            border-color: #ffd700;
            border-width: 5px;
            animation: pulse-yellow 0.5s infinite;
        }

        .face-frame.move-right {
            border-color: #00bfff;
            animation: slide-right 0.5s infinite;
        }

        .face-frame.move-left {
            border-color: #00bfff;
            animation: slide-left 0.5s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse-yellow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes slide-right {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-40%, -50%); }
        }

        @keyframes slide-left {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-60%, -50%); }
        }

        .progress-section {
            margin: 25px 0;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 20px;
            border: 2px solid #dee2e6;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            font-weight: 600;
            margin-top: 5px;
        }

        .current-pose {
            text-align: center;
            font-size: 1.3em;
            color: #667eea;
            margin: 15px 0;
            padding: 15px;
            background: #fff;
            border-radius: 15px;
            font-weight: 700;
        }

        .quality-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .quality-bar {
            width: 150px;
            height: 12px;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
        }

        .quality-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            transition: width 0.3s ease;
        }

        .pose-checklist {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .pose-item {
            text-align: center;
            padding: 12px;
            background: #fff;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .pose-item.completed {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        .pose-item.pending {
            background: #e9ecef;
            color: #666;
        }

        .pose-item.current {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .message-box {
            padding: 15px;
            margin: 15px 0;
            border-radius: 15px;
            text-align: center;
            font-size: 1em;
            font-weight: 500;
        }

        .message-box.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        .message-box.error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: #fff;
        }

        .message-box.info {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #e9ecef 0%, #adb5bd 100%);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .liveness-challenge {
            display: none;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            margin: 25px 0;
            border: 2px solid #dee2e6;
        }

        .liveness-challenge.active {
            display: block;
        }

        .liveness-challenge h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .liveness-challenge p {
            color: #666;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .pose-checklist {
                grid-template-columns: repeat(2, 1fr);
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
    <script src="/static/Js/portal-auth.js"></script>
    <script>requirePortalAccess('registration', { allowSelfRegistration: true });</script>
</head>
<body>
    <div class="face-registration-container">
        <h1 id="personName">تسجيل الوجه الذكي</h1>

        <div class="camera-container">
            <video id="videoElement" autoplay playsinline></video>
            <div id="faceFrame" class="face-frame"></div>
            <div id="guidanceOverlay" style="position: absolute; top: 15px; left: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 15px; border-radius: 10px; text-align: center; font-size: 0.95em; display: none;">
                <div id="guidanceText"></div>
            </div>
        </div>

        <div class="progress-section">
            <div class="current-pose" id="currentPose">اضغط "بدء تسجيل الوجه" للبدء</div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalSamples">0</div>
                    <div class="stat-label">إجمالي العينات</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="acceptedSamples">0</div>
                    <div class="stat-label">مقبولة</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="rejectedSamples">0</div>
                    <div class="stat-label">مرفوضة</div>
                </div>
            </div>

            <div class="quality-indicator">
                <span style="color: #666; font-weight: 600;">الجودة:</span>
                <div class="quality-bar">
                    <div class="quality-fill" id="qualityFill" style="width: 0%"></div>
                </div>
                <span id="qualityValue" style="color: #667eea; font-weight: 700;">0%</span>
            </div>

            <div class="pose-checklist" id="poseChecklist">
                <div class="pose-item pending" data-pose="front">أمام</div>
                <div class="pose-item pending" data-pose="right_15">يمين 15°</div>
                <div class="pose-item pending" data-pose="right_30">يمين 30°</div>
                <div class="pose-item pending" data-pose="left_15">يسار 15°</div>
                <div class="pose-item pending" data-pose="left_30">يسار 30°</div>
                <div class="pose-item pending" data-pose="up">أعلى</div>
                <div class="pose-item pending" data-pose="down">أسفل</div>
                <div class="pose-item pending" data-pose="unknown">طبيعي</div>
            </div>

            <div class="message-box info" id="messageBox">
                يرجى التأكد من إضاءة جيدة ووجه واضح
            </div>
        </div>

        <div class="liveness-challenge" id="livenessChallenge">
            <h2>تحدي التحقق الحيوي</h2>
            <p>رمش عينيك الآن للتحقق من أنك شخص حقيقي</p>
            <p id="blinkStatus">في انتظار الرمش...</p>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn" onclick="startRegistration()">بدء تسجيل الوجه</button>
            <button class="btn btn-secondary" id="stopBtn" onclick="stopRegistration()" style="display: none;">إيقاف التسجيل</button>
            <button class="btn btn-secondary" id="saveBtn" onclick="saveFaceData()" style="display: none;">حفظ البيانات</button>
            <button class="btn btn-secondary" onclick="goBack()">رجوع</button>
        </div>
    </div>

    <script src="/static/Js/api-client.js"></script>
    <script src="/static/Js/database.js"></script>
    <script src="/static/Js/face-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="/static/Js/face-recognition-engine.js"></script>
    <script src="/static/Js/face-storage.js"></script>
    <script src="/static/Js/face-registration-new.js"></script>
</body>
</html>
