[phases.setup]
nixPkgs = ["python311", "mariadb"]

[phases.build]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install --upgrade pip",
  "pip install -r requirements-railway.txt"
]

[start]
cmd = "python mysql/database.py"

[variables]
PYTHON_VERSION = "3.11"
