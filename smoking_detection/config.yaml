# Smoking Detection System Configuration
# Detect smoking behavior in images

# Dataset paths
dataset:
  path: F:/MUQ/dataset
  train: training_data
  val: validation_data
  test: testing_data

# Classes
classes:
  smoking: 0
  notsmoking: 1

# Model configuration
model:
  # YOLOv8 model variants
  variant: yolov8n  # n=nano, s=small, m=medium, l=large, x=xlarge
  pretrained: true   # Use COCO pre-trained weights
  confidence: 0.5   # Detection confidence threshold
  iou: 0.45         # IoU threshold for NMS

# Training parameters
training:
  epochs: 100
  batch_size: 16
  img_size: 640
  device: cuda      # cuda or cpu
  workers: 4
  save_period: 10   # Save model every 10 epochs

# Augmentation
augmentation:
  hsv_h: 0.015      # HSV-Hue augmentation
  hsv_s: 0.7        # HSV-Saturation augmentation
  hsv_v: 0.4        # HSV-Value augmentation
  degrees: 10.0     # Rotation (+/- deg)
  translate: 0.1    # Translation (+/- fraction)
  scale: 0.5        # Scale (+/- gain)
  shear: 0.0        # Shear (+/- deg)
  perspective: 0.0  # Perspective (+/- fraction)
  flipud: 0.0       # Flip up-down
  fliplr: 0.5       # Flip left-right
  mosaic: 1.0       # Mosaic augmentation
  mixup: 0.0        # Mixup augmentation

# Smoking detection rules
smoking_detection:
  # Detection thresholds
  person_detection: true      # Detect person first
  smoking_threshold: 0.6     # Confidence threshold for smoking detection
  hand_detection: true        # Detect hand holding cigarette

  # Smoking indicators
  indicators:
    - cigarette_in_hand
    - smoke_near_mouth
    - holding_pose

# Output
output:
  save_detections: true
  save_video: false
  output_dir: ./results
